<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رُكبة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>رُكبة</title>
<meta name="description" content="متابعة تأهيل الوتر الرضفي مع المعالج الطبيعي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* التخطيط: شريط علوي ثابت + تبويبات، ومحتوى بعمود واحد على الموبايل وشبكة على الآيباد */
:root {
  --bg: #eef3f2; --surface: #ffffff; --surface-2: #f4f8f7; --ink: #11282a; --ink-2: #47605f; --muted: #7c918f; --line: #d6e1df;
  --accent: #0d6d6a; --accent-ink: #ffffff; --accent-soft: #d6ecea;
  --path: #c27b14; --path-soft: #f7ead2;
  --ok: #1f8a4c; --ok-soft: #dbf1e3; --warn: #b77700; --warn-soft: #faefd3; --bad: #c83a3a; --bad-soft: #f9dfdf;
  --bone: #e9dcc0; --bone-line: #a8936a; --muscle: #d77a6f; --muscle-line: #a84b42; --tendon: #f3ecd9; --tendon-line: #b49a5d; --nerve: #e3b729; --skin: #f1d9c7;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --f-display: 'Noto Kufi Arabic', 'Geeza Pro', Tahoma, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', -apple-system, 'SF Arabic', 'Geeza Pro', Tahoma, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1718; --surface: #142224; --surface-2: #1a2c2e; --ink: #e5efee; --ink-2: #a6bcba; --muted: #7d9593; --line: #29403f;
  --accent: #3fb6b0; --accent-ink: #062020; --accent-soft: #173d3c; --path: #e3a23c; --path-soft: #3a2c13;
  --ok: #4cc27f; --ok-soft: #173a27; --warn: #e0a42c; --warn-soft: #3b2f12; --bad: #ec6b6b; --bad-soft: #3d1f1f;
  --bone: #5c5240; --bone-line: #c2ad80; --muscle: #8f4a43; --muscle-line: #e0857a; --tendon: #6c6247; --tendon-line: #d9c18a; --nerve: #f0c93f; --skin: #4a3a31;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1718; --surface: #142224; --surface-2: #1a2c2e; --ink: #e5efee; --ink-2: #a6bcba; --muted: #7d9593; --line: #29403f;
  --accent: #3fb6b0; --accent-ink: #062020; --accent-soft: #173d3c; --path: #e3a23c; --path-soft: #3a2c13;
  --ok: #4cc27f; --ok-soft: #173a27; --warn: #e0a42c; --warn-soft: #3b2f12; --bad: #ec6b6b; --bad-soft: #3d1f1f;
  --bone: #5c5240; --bone-line: #c2ad80; --muscle: #8f4a43; --muscle-line: #e0857a; --tendon: #6c6247; --tendon-line: #d9c18a; --nerve: #f0c93f; --skin: #4a3a31;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.65; margin: 0; }
body { direction: rtl; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--series-1); outline-offset: 2px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.35; text-wrap: balance; margin: 0; }

/* ---------- الهيكل ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; }
.brandrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.brand small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.grow { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.acc { background: var(--accent-soft); color: var(--accent); } .badge.path { background: var(--path-soft); color: var(--path); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 10px; white-space: nowrap; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 80px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-size: clamp(22px, 3vw, 30px); }
.head p { margin: 4px 0 0; color: var(--ink-2); }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 960px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .g2, .g3 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 17px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub { color: var(--ink-2); } .muted { color: var(--muted); font-size: 13.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ai { background: var(--path-soft); color: var(--path); border-color: transparent; }
.btn.sm { min-height: 34px; padding: 4px 11px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.note { border-radius: 12px; padding: 10px 14px; font-size: 14.5px; background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); } .note.path { background: var(--path-soft); }
label.f { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; }
input[type=number], input[type=text], input[type=password], input[type=date], input[type=url], select, textarea { width: 100%; min-height: 42px; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); margin-top: 4px; }
input[type=number] { direction: ltr; text-align: right; }
textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
.t-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th, .t td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.t th { background: var(--surface-2); font-size: 12px; color: var(--ink-2); position: sticky; top: 0; }
.t td.l, .t th.l { text-align: start; }
.t tr:last-child td { border-bottom: 0; }
.c-done { color: var(--ok); font-weight: 700; } .c-skip { color: var(--bad); font-weight: 700; } .c-na { color: var(--muted); }

/* ---------- الشاشة ---------- */
.journey { padding: 14px 16px 6px; overflow: hidden; }
.journey svg { width: 100%; height: auto; display: block; direction: ltr; }
.journey .lbl { font-family: var(--f-body); font-size: 11px; fill: var(--ink-2); }
.journey .lbl.b { font-weight: 700; fill: var(--ink); font-size: 12px; }
.pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 0%,100% { opacity: .9; transform: scale(1); } 50% { opacity: .25; transform: scale(1.9); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.kpi .v small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.kpi .d { font-size: 12.5px; color: var(--muted); }
.meter { height: 7px; border-radius: 9px; background: var(--accent-soft); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
.gauge { display: flex; flex-direction: column; align-items: center; }
.gauge svg { width: 100%; max-width: 260px; height: auto; direction: ltr; }

/* ---------- السجل ---------- */
.ex-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ex-row:last-child { border-bottom: 0; }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; font-size: 20px; font-weight: 700; color: transparent; }
.chk[data-s="done"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.chk[data-s="skip"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.ex-n { font-weight: 600; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.ex-m { font-size: 12.5px; color: var(--ink-2); }
.scale { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; margin-top: 4px; }
.scale button { min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 600; padding: 0; font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.datebar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.datebar input { width: auto; margin: 0; }

/* ---------- الجدول ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .dh { font-size: 11.5px; color: var(--muted); text-align: center; }
.cal .c { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; position: relative; overflow: hidden; }
.cal .c .fill { position: absolute; inset: auto 0 0 0; background: var(--accent); opacity: .85; }
.cal .c span { position: relative; z-index: 1; font-weight: 600; }
.cal .c.full span { color: var(--accent-ink); }
.cal .c i { position: relative; z-index: 1; width: 7px; height: 7px; border-radius: 50%; margin-top: 2px; }
.cal .c.empty { visibility: hidden; }
.cal .c.today { outline: 2px solid var(--ink); }
.cal .c.out { opacity: .35; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }

/* ---------- الخطة ---------- */
.lv { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.lv:last-child { border-bottom: 0; }
.lv .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); border: 2px solid var(--line); color: var(--muted); }
.lv.done .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lv.now .n { border-color: var(--path); color: var(--path); box-shadow: 0 0 0 4px var(--path-soft); }
.exc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.exc ol { margin: 6px 0 0; padding-inline-start: 20px; font-size: 14px; }
.exc .dose { display: inline-block; background: var(--surface-2); border-radius: 8px; padding: 2px 9px; font-size: 13px; }

/* ---------- الإصابة ---------- */
.knee { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .knee { grid-template-columns: 1fr; } }
.knee svg { width: 100%; height: auto; display: block; direction: ltr; max-height: 560px; }
.layer-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.layer-toggles button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.layer-toggles button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.layer-toggles i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.stage-slider { width: 100%; accent-color: var(--path); }
.stages { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); gap: 4px; }
.stages span { flex: 1; text-align: center; cursor: pointer; }
.stages span.on { color: var(--path); font-weight: 700; }
.what { display: grid; gap: 8px; }
.what div { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.what b { display: block; font-size: 12.5px; color: var(--muted); }
.refs li { direction: ltr; text-align: left; font-size: 13px; margin-bottom: 6px; color: var(--ink-2); }
.tl { position: relative; padding-inline-start: 22px; }
.tl::before { content: ''; position: absolute; inset-inline-start: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl > div { position: relative; padding-bottom: 14px; }
.tl > div::before { content: ''; position: absolute; inset-inline-start: -20px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.tl > div.peak::before { border-color: var(--ok); } .tl > div.warn::before { border-color: var(--warn); } .tl > div.down::before { border-color: var(--bad); }
.tl > div.key::before { background: var(--path); border-color: var(--path); } .tl > div.start::before { background: var(--accent); border-color: var(--accent); }
.tl b { display: block; } .tl small { color: var(--muted); }

/* ---------- عام ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; direction: ltr; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 7px; white-space: nowrap; opacity: 0; transform: translate(-50%, -105%); z-index: 5; }
.chart .tip.show { opacity: 1; }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(640px, 94vw); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(5, 15, 15, .55); }
dialog .dh { padding: 16px 18px 0; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
dialog .db { padding: 12px 18px; max-height: 70vh; overflow-y: auto; }
dialog .df { padding: 10px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 14px; }
.toast.show { opacity: 1; }
.viewer-banner { background: var(--path-soft); color: var(--ink); border-radius: 12px; padding: 8px 14px; font-size: 14px; margin-bottom: 14px; }
.skeleton { padding: 40px 16px; text-align: center; color: var(--muted); }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
.paper h2 { font-size: 15px; margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); color: var(--accent); }
.xr { display: grid; gap: 12px; }
.xr img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
.xr figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brandrow">
    <div class="brand"><svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><path d="M14 6c1 6 1.5 9 4.5 12.5" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="21" cy="20" rx="4" ry="5" fill="var(--accent-ink)"/><path d="M21.5 25c.3 3.5 1 6 3.5 9" stroke="var(--path)" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
      <div><b>رُكبة</b><small>الطريق إلى السجدة</small></div></div>
    <span class="grow"></span>
    <span id="mode" class="badge">جاري التحميل…</span>
    <span id="save" class="badge" hidden></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
</div></header>
<main id="main"><div class="skeleton">جاري تحميل بيانات المتابعة…</div></main>

<script>
'use strict';
/* ================= أدوات ================= */
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const r0 = Math.round, r1 = n => Math.round(n * 10) / 10;
const fmt = (n, d = 0) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: d });
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sum = a => a.filter(x => x != null && !isNaN(x)).reduce((s, x) => s + x, 0);
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => iso(new Date());
const range = (a, b) => { const o = []; for (let d = a; d <= b; d = addDays(d, 1)) o.push(d); return o; };
const fD = (s, o) => new Intl.DateTimeFormat('ar-IQ-u-nu-latn', o || { day: 'numeric', month: 'long' }).format(parse(s));
const fS = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth() + 1}`; };
const wd = s => new Intl.DateTimeFormat('ar-IQ', { weekday: 'short' }).format(parse(s));

  return `<svg viewBox="0 0 260 160" aria-label="زاوية ثني الركبة">${arc(0, 160, 'var(--accent-soft)', 14)}${arc(0, Math.min(160, v), 'var(--accent)', 14)}
    <line x1="${cx}" y1="${cy}" x2="${gx}" y2="${gy}" stroke="var(--path)" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${gx}" cy="${gy}" r="6" fill="var(--path)"/>

}

    <h2>الالتزام حسب التمرين</h2><div class="t-wrap"><table class="t"><thead><tr><th class="l">التمرين</th><th>الجرعة</th><th>منجز</th><th>متروك</th><th>النسبة</th></tr></thead><tbody>${exRows.map(r => `<tr><td class="l" dir="ltr" style="text-align:right">${esc(r.e.name)}</td><td>${esc(r.e.dose)}</td><td>${r.dn}/${r.n}</td><td>${r.sk || '–'}</td><td style="color:${r.n && r.dn / r.n < .6 ? 'var(--warn)' : 'var(--ink)'}">${r.n ? r0(r.dn / r.n * 100) + '%' : '—'}</td></tr>`).join('')}</tbody></table></div>
    <h2>السجل اليومي</h2>${phs.map(P => { const exs = activeEx(P); return `<div class="t-wrap" style="margin-bottom:8px"><table class="t"><thead><tr><th class="l">اليوم</th>${exs.map(e => `<th dir="ltr">${esc(e.short)}</th>`).join('')}<th>ألم</th><th>صبح</th><th>خطوات</th></tr></thead><tbody>${w.st.filter(s => s.ph === P).map(s => `<tr><td class="l">${wd(s.date)} ${fS(s.date)}</td>${exs.map(e => { const v = s.log?.ex?.[e.id]?.d; return v === true ? '<td class="c-done">✓</td>' : v === false ? '<td class="c-skip">✕</td>' : '<td class="c-na">–</td>'; }).join('')}<td style="color:${painCol(s.painMax, s.limit)}">${s.painMax ?? '–'}</td><td style="color:${painCol(s.painMorning, s.limit)}">${s.painMorning ?? '–'}</td><td>${s.log?.steps != null ? fmt(s.log.steps) : '–'}</td></tr>`).join('')}</tbody></table></div>`; }).join('')}
    <h2>ملاحظات المريض</h2>${notes.length ? notes.map(s => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="font-size:13px;color:var(--accent)">${wd(s.date)} ${fD(s.date)}${s.log.flag ? ' · مهم' : ''}</b><p dir="auto" style="margin:2px 0 0;white-space:pre-wrap">${esc(s.log.notes)}</p></div>`).join('') : '<p class="muted">لا توجد.</p>'}
    ${qs.length ? `<h2>أسئلة للدكتور</h2><ol>${qs.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
  </div>`;
}
function journeyReport() {
  const p = D.profile, t = today(), all = range(p.startDate, t), w = windowStats(all);
  const first14 = windowStats(range(p.startDate, addDays(p.startDate, 13))), last14 = windowStats(range(addDays(t, -13), t));
  const goalsDone = D.goals.filter(g => goalProgress(g).p >= 1);
  return `<div class="paper">
    <h1 style="font-size:22px">رحلة رُكبة: من الإصابة إلى ${levelStatus(D.levels.at(-1)) === 'done' ? 'التعافي' : 'اليوم'}</h1><div class="muted">${esc(p.name)} · ${esc(p.diagnosis)} · المعالج ${esc(p.therapist)}</div>
    <h2>القصة باختصار</h2><div class="tl">${D.timeline.map(e => `<div class="${e.kind}"><b>${esc(e.title)}</b><small>${fMonth(e.date)}</small><div class="sub" style="font-size:14px">${esc(e.text)}</div></div>`).join('')}</div>
    <h2>قبل وبعد</h2><div class="grid g4">${kpi('أيام العلاج', fmt(all.length), `منذ ${fD(p.startDate)}`)}${kpi('الخطوات', `${fmt(first14.steps)} ← ${fmt(last14.steps)}`, 'أول 14 يوم مقابل آخر 14')}${kpi('الالتزام الكلي', w.adh == null ? '—' : r0(w.adh * 100) + '%', `${w.logged.length} يوم مسجل`)}${kpi('زاوية الثني', `90° ← ${curFlex()}°`, `هدف السجود ${p.flexionGoal}°`)}</div>
    <h2>المستويات</h2><div>${D.levels.map((L, i) => { const s = levelStatus(L); return `<div class="lv ${s}"><span class="n">${i + 1}</span><div><b>${esc(L.name)}</b> ${s === 'done' ? '<span class="badge ok">تم</span>' : s === 'now' ? '<span class="badge path">الآن</span>' : ''}<div class="sub" style="font-size:14px">${esc(L.desc)}</div></div></div>`; }).join('')}</div>
    <h2>الخطوات والألم على كامل الفترة</h2>${chart({ type: 'bar', w: 900, h: 200, xt: 10, data: all.map(d => ({ x: d, y: D.logs[d]?.steps ?? null })), tip: d => `${fD(d.x)}: ${fmt(d.y)}` })}${chart({ type: 'line', w: 900, h: 180, xt: 10, data: all.map(d => { const s = dayStats(d); return { x: d, y: s.painMax, m: s.painMorning }; }), series: [{ key: 'y', color: 'var(--series-1)' }, { key: 'm', color: 'var(--series-2)' }], yMin: 0, yMax: 10, ticks: [0, 2, 4, 6, 8, 10], tip: d => `${fD(d.x)}: ${d.y ?? '—'} / ${d.m ?? '—'}` })}
    <h2>الأهداف المتحققة</h2>${goalsDone.length ? `<ul>${goalsDone.map(g => `<li>${esc(g.title)}</li>`).join('')}</ul>` : '<p class="muted">ولا هدف تحقق للحين. الطريق مستمر.</p>'}
    <h2>الأشعة</h2><div class="xr grid g2">${D.xrays.map(x => `<figure style="margin:0"><img src="${esc(x.file)}" alt="${esc(x.caption)}"><figcaption>${esc(x.caption)}</figcaption></figure>`).join('')}</div>
    <h2>المراجع</h2><ol class="refs">${REFS.map(([r, u]) => `<li>${esc(r)} <a href="${u}" target="_blank" rel="noopener">رابط</a></li>`).join('')}</ol>
  </div>`;
}
function standalone(inner, title) {
  const css = $('style').textContent;
  const base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
  const fixed = inner.replace(/src="(xray-[^"]+)"/g, (m, f) => `src="${base}${f}"`);
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)} — ${esc(D.profile.name)}</title><style>${css} body{padding:16px} .chart .tip{display:none}</style></head><body>${fixed}<p style="font-size:12px;color:#888;text-align:center;margin-top:16px">من تطبيق رُكبة · ${today()}</p></body></html>`;
}

/* ================= الإعدادات ================= */
VIEWS.settings = {
  html() {
    const p = D.profile;
    return `<div class="head"><div><h1>الإعدادات والبيانات</h1><p>البيانات محفوظة على هذا الجهاز، وتتزامن بين أجهزتك عن طريق GitHub Gist إذا فعّلته.</p></div></div>
    <div class="grid g2" style="align-items:start">
      <section class="card"><h2>الملف</h2><div class="grid g2">
        ${[['name', 'الاسم', 'text'], ['startWeight', 'وزن البداية', 'number'], ['goalWeight', 'الوزن الهدف', 'number'], ['flexionNow', 'زاوية الثني الأولية', 'number'], ['flexionGoal', 'زاوية السجود الهدف', 'number'], ['startDate', 'بداية العلاج', 'date']].map(([k, l, ty]) => `<label class="f">${l}<input type="${ty}" data-pk="${k}" value="${esc(p[k] ?? '')}" ${ty === 'number' ? 'step="any"' : ''}></label>`).join('')}</div>
        <p class="muted">زاوية السجود الهدف حددها مع الدكتور.</p></section>
      <section class="card"><h2>نقل البيانات</h2>
        <p class="sub" style="margin-top:0">بيانات نسخة رُكبة القديمة على هذا الجهاز انقلت تلقائياً أول مرة. ولو عندك ملف تصدير قديم من جهاز ثاني، استورده هنا. الدمج ياخذ الأحدث لكل يوم.</p>
        <div class="row"><label class="btn" for="imp">استيراد ملف</label><input type="file" id="imp" accept=".json,application/json" hidden><button class="btn" id="exp">تصدير نسخة</button></div></section>
      <section class="card"><h2>المزامنة بين الأجهزة (GitHub Gist)</h2>
        ${(() => { const s = Sync.secrets(); return Sync.enabled()
          ? `<p class="sub" style="margin-top:0">المزامنة مفعّلة${s.lastSync ? ' · آخر مزامنة ' + new Date(s.lastSync).toLocaleTimeString('ar-IQ-u-nu-latn', { hour: '2-digit', minute: '2-digit' }) : ''}. نفس التوكن على الآيباد واللابتوب يخلي البيانات وحدة.</p>
             <div class="row"><button class="btn primary" id="saveNow">زامن الآن</button><button class="btn" id="gOff">إيقاف المزامنة</button></div>`
          : `<p class="sub" style="margin-top:0">الصق توكن GitHub (صلاحية gist فقط). يُحفظ على هذا الجهاز بس. إذا عندك Gist من النسخة القديمة، الصق رقمه حتى تنحفظ بنفس المكان.</p>
             <label class="f">التوكن<input type="password" id="gTok" dir="ltr" value="${esc(s.token || '')}"></label>
             <label class="f" style="margin-top:8px">رقم الـ Gist (اختياري)<input type="text" id="gId" dir="ltr" value="${esc(s.gistId || '')}"></label>
             <div class="row" style="margin-top:8px"><button class="btn primary" id="gOn">فعّل المزامنة</button></div>`; })()}</section>
      <section class="card"><h2>رابط الدكتور</h2>
        ${(() => { const s = Sync.secrets(); if (!Sync.enabled() || !s.gistId) return '<p class="sub" style="margin:0">فعّل المزامنة أولاً، وبعدها يطلع هنا رابط خاص للدكتور.</p>';
          const link = location.href.replace(/[#?].*$/, '') + '?d=' + s.gistId;
          return `<p class="sub" style="margin-top:0">ابعث هذا الرابط لد. أصيل. يشوف "عرض التقدم" بس: الشاشة، والجدول، والخطة بتمارينها وطريقة أدائها، والأهداف، والإصابة، والتقارير. ويتحدث كل ما تزامن. ما يشوف التسجيل ولا الإعدادات.</p>
            <input type="text" readonly dir="ltr" id="docLink" value="${esc(link)}" style="width:100%"><div class="row" style="margin-top:8px"><button class="btn" id="cpLink">انسخ الرابط</button></div>`; })()}</section>
    </div>`;
  },
  bind(root) {
    $$('[data-pk]', root).forEach(i => i.onchange = () => { D.profile[i.dataset.pk] = i.type === 'number' ? num(i.value) : i.value; markDirty('cfg'); toast('حُفظ'); });
    const sn = $('#saveNow', root); if (sn) sn.onclick = () => { manualSave = true; clearTimeout(saveTimer); saveCloud(true); };
    const go = $('#gOff', root); if (go) go.onclick = () => { Sync.setSecrets({ ...Sync.secrets(), on: false }); saveState(); render(); };
    const gon = $('#gOn', root); if (gon) gon.onclick = async () => {
      const token = $('#gTok', root).value.trim(), gistId = $('#gId', root).value.trim(); if (!token) { toast('الصق التوكن'); return; }
      Sync.setSecrets({ ...Sync.secrets(), token, gistId: gistId || Sync.secrets().gistId, on: true }); manualSave = true; await saveCloud(true); render(); };
    const cp = $('#cpLink', root); if (cp) cp.onclick = async () => { const i = $('#docLink', root); try { await navigator.clipboard.writeText(i.value); toast('انسخ'); } catch { i.select(); } };
    $('#exp', root).onclick = () => CAP.downloads.save({ filename: `rukba-data-${today()}.json`, data: JSON.stringify(D, null, 1) });
    $('#imp', root).onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => {
      try { const n = importData(JSON.parse(rd.result)); markDirty('cfg'); toast(`تم دمج ${n} يوم`); render(); }
      catch { toast('الملف مو نسخة رُكبة صالحة'); } }; rd.readAsText(f); e.target.value = ''; };
  }
};

boot();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
