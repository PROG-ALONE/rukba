<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رُكبة — مسار التأهيل والتغذية</title>
<meta name="description" content="متابعة تأهيل الوتر الرضفي والتغذية ونزول الوزن">
<meta name="theme-color" content="#0b6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="رُكبة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ======== رُكبة — نظام التأهيل والتغذية ======== */
:root {
  color-scheme: light;
  --bg: #e9efee;
  --card: #ffffff;
  --card-2: #f4f7f6;
  --ink: #142628;
  --ink-2: #48605f;
  --muted: #7d908f;
  --line: #d3dddb;
  --accent: #0b6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe9;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --ok: #1e8e4e;
  --ok-soft: #dbf1e3;
  --warn: #b97800;
  --warn-soft: #fbefd2;
  --bad: #cf3a3a;
  --bad-soft: #fadede;
  --shadow: 0 1px 0 rgba(20, 38, 40, .06), 0 8px 24px -16px rgba(20, 38, 40, .25);
  --r: 14px;
  --font: 'IBM Plex Sans Arabic', -apple-system, 'SF Arabic', 'Geeza Pro', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1819; --card: #152324; --card-2: #1b2c2d; --ink: #e6efee; --ink-2: #a8bdbb; --muted: #7f9593;
    --line: #2a3d3e; --accent: #3db0ac; --accent-ink: #062021; --accent-soft: #163b3b;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --ok: #4cc27f; --ok-soft: #173a27; --warn: #e0a42c; --warn-soft: #3b2f12; --bad: #ec6b6b; --bad-soft: #3d1f1f;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1819; --card: #152324; --card-2: #1b2c2d; --ink: #e6efee; --ink-2: #a8bdbb; --muted: #7f9593;
  --line: #2a3d3e; --accent: #3db0ac; --accent-ink: #062021; --accent-soft: #163b3b;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --ok: #4cc27f; --ok-soft: #173a27; --warn: #e0a42c; --warn-soft: #3b2f12; --bad: #ec6b6b; --bad-soft: #3d1f1f;
  --shadow: 0 1px 0 rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--series-1); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
td.num, th.num { display: table-cell; direction: rtl; unicode-bidi: normal; }
.kpi .val.num, .cycle-top .big.num, .sumbar b.num { display: block; direction: rtl; }

/* ---------- الهيكل ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-inline-end: 1px solid var(--line);
  background: var(--card); display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand svg { flex: none; }
.brand b { font-size: 20px; letter-spacing: -.2px; display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { background: var(--card-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px; font-size: 12px; color: var(--muted); }
.side-foot .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-inline-end: 6px; }
.side-foot .dot.on { background: var(--ok); }

main { padding: 28px clamp(16px, 3vw, 40px) 120px; max-width: 1180px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-head h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: -.3px; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }

.tabbar { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  main { padding-top: 18px; }
  .tabbar {
    display: flex; position: fixed; inset-inline: 0; bottom: 0; z-index: 30; background: var(--card);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); overflow-x: auto;
  }
  .tabbar a { flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; padding: 4px 2px; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .page-head h1 { font-size: 23px; }
}

/* ---------- عناصر عامة ---------- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 620px) { .g2, .g3 { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); border: 1px solid var(--line); min-width: 0; }
.card h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 { font-size: 15px; margin: 18px 0 8px; }
.sub { color: var(--ink-2); font-size: 14px; }
.muted { color: var(--muted); font-size: 13px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spacer { flex: 1; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink);
}
.btn:hover { background: var(--card-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }
.iconbtn { width: 42px; padding: 0; }

label.f { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; }
label.f > input, label.f > select, label.f > textarea { margin-top: 4px; }
input[type=number], input[type=text], input[type=date], input[type=password], input[type=url], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2);
}
input[type=number] { direction: ltr; text-align: right; }
textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

.alert { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.alert svg { flex: none; width: 20px; height: 20px; margin-top: 2px; }
.alert.warn { background: var(--warn-soft); color: var(--ink); }
.alert.warn svg { color: var(--warn); }
.alert.bad { background: var(--bad-soft); }
.alert.bad svg { color: var(--bad); }
.alert.info { background: var(--accent-soft); }
.alert.info svg { color: var(--accent); }

/* ---------- لوحة اليوم ---------- */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
@media (max-width: 980px) { .hero { grid-template-columns: 1fr; } }
.cycle-card { padding: 22px 22px 18px; }
.cycle-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.cycle-top .big { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
.cycle-top .big small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-inline-start: 4px; }
.strip { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 5px; margin-top: 18px; }
.strip .d {
  aspect-ratio: 1 / 1.35; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 0 5px; font-size: 11px; color: var(--muted);
  text-decoration: none; overflow: hidden;
}
.strip .d .fill { position: absolute; inset: auto 0 0 0; background: var(--accent); opacity: .85; }
.strip .d span { position: relative; z-index: 1; font-weight: 600; }
.strip .d.full span { color: var(--accent-ink); }
.strip .d .pd { position: relative; z-index: 1; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
.strip .d.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.strip .d.future { opacity: .45; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }

.kpi .lbl { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.kpi .val { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1.2; margin-top: 4px; }
.kpi .val small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.kpi .delta { font-size: 13px; margin-top: 2px; }
.meter { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 10px; }
.meter > div { height: 100%; background: var(--accent); border-radius: 99px; }

.todo li { padding: 6px 0; }
.check-list { list-style: none; margin: 0; padding: 0; }
.check-list li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.check-list li:last-child { border-bottom: 0; }
.tick { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--line); margin-top: 1px; }
.tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }

/* ---------- السجل اليومي ---------- */
.datebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.datebar input[type=date] { width: auto; }
.saved { font-size: 13px; color: var(--ok); opacity: 0; transition: opacity .3s; }
.saved.show { opacity: 1; }
.ex-row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ex-row:last-child { border-bottom: 0; }
.ex-check { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--card-2); display: grid; place-items: center; cursor: pointer; }
.ex-check svg { width: 26px; height: 26px; opacity: 0; }
.ex-check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.ex-check[aria-pressed="true"] svg { opacity: 1; }
.ex-check[data-state="skip"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.ex-check[data-state="skip"] svg { opacity: 1; }
.ex-name { font-weight: 600; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.ex-meta { font-size: 13px; color: var(--ink-2); }
.ex-meta a { text-decoration: none; font-weight: 600; }
.ex-pain select { width: 92px; min-height: 40px; }

.scale { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.scale button {
  min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); cursor: pointer; font-weight: 600; padding: 0;
  font-variant-numeric: tabular-nums;
}
.scale button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.scale-wrap { margin-bottom: 14px; }
.scale-wrap .sl { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card-2); }
.stepper button { width: 40px; height: 42px; border: 0; background: transparent; font-size: 20px; cursor: pointer; }
.stepper input { width: 80px; border: 0; border-radius: 0; text-align: center; background: transparent; min-height: 42px; }
.stepper input:focus { box-shadow: none; }

.meal-slot { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.meal-slot h4 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card-2); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.meal-line { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; flex-wrap: wrap; }

.sumbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 620px) { .sumbar { grid-template-columns: 1fr 1fr; } }
.sumbar > div { background: var(--card-2); border-radius: 10px; padding: 10px 12px; }
.sumbar b { display: block; font-size: 20px; }
.sumbar span { font-size: 12.5px; color: var(--ink-2); }

/* ---------- الجداول ---------- */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
.tbl th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; background: var(--card-2); position: sticky; top: 0; }
.tbl td.c, .tbl th.c { text-align: center; }

/* ---------- الرسوم ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 10px; border-radius: 8px;
  white-space: nowrap; transform: translate(50%, -110%); opacity: 0; transition: opacity .12s; z-index: 5; line-height: 1.4;
}
.chart .tip.show { opacity: 1; }
.chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 6px 12px; cursor: pointer; font-size: 13.5px; min-height: 36px; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- الخطة / المسار ---------- */
.roadmap { position: relative; padding-inline-start: 34px; }
.roadmap::before { content: ''; position: absolute; inset-inline-start: 12px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.rm-step { position: relative; padding: 0 0 22px; }
.rm-step .node { position: absolute; inset-inline-start: -30px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); }
.rm-step.done .node { background: var(--accent); border-color: var(--accent); }
.rm-step.now .node { background: var(--card); border: 5px solid var(--accent); }
.rm-step h3 { margin: 0; font-size: 16px; }
.rm-step p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }

.day-plan { display: grid; grid-template-columns: 90px 1fr; gap: 0; font-size: 14.5px; }
.day-plan > div { padding: 9px 0; border-bottom: 1px solid var(--line); }
.day-plan .t { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

/* ---------- التعليم ---------- */
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.lesson-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; }
.lesson-card:hover { border-color: var(--accent); }
.lesson-card .k { font-size: 12.5px; color: var(--accent); font-weight: 600; }
.lesson-card b { font-size: 16.5px; line-height: 1.4; }
.lesson-card span { font-size: 14px; color: var(--ink-2); }
.article { max-width: 72ch; }
.article h1 { font-size: 30px; line-height: 1.3; margin: 0 0 6px; }
.article h2 { font-size: 21px; margin: 32px 0 8px; }
.article h3 { font-size: 17px; margin: 22px 0 6px; }
.article p, .article li { font-size: 17px; line-height: 1.85; }
.article .lead { font-size: 18.5px; color: var(--ink-2); }
.article .en { direction: ltr; unicode-bidi: isolate; font-size: .92em; color: var(--ink-2); }
.article .box { background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px; padding: 14px 18px; margin: 18px 0; }
.article .box.warn { border-inline-start-color: var(--warn); }
.article figure { margin: 20px 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.article figcaption { font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }
.article table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
.article th, .article td { border-bottom: 1px solid var(--line); padding: 8px; text-align: start; }
.article .refs li { font-size: 14px; direction: ltr; text-align: left; }

/* ---------- نافذة ---------- */
dialog { border: 0; border-radius: 16px; padding: 0; max-width: min(560px, 94vw); width: 100%; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10, 20, 21, .5); }
dialog .dh { padding: 18px 20px 0; font-weight: 700; font-size: 18px; }
dialog .db { padding: 14px 20px; }
dialog .df { padding: 12px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.toast { position: fixed; bottom: 90px; inset-inline-start: 50%; transform: translateX(50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14.5px; z-index: 100; opacity: 0; transition: opacity .2s; pointer-events: none; }
html[dir=rtl] .toast { transform: translateX(50%); }
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================= التقرير ================= */
.report-tools { margin-bottom: 18px; }
.paper {
  background: #fff; color: #17282a; width: 100%; max-width: 900px; margin: 0 auto; padding: 44px 48px; border-radius: 6px;
  box-shadow: 0 2px 30px rgba(0,0,0,.12); font-size: 13.5px; line-height: 1.55; color-scheme: light;
  --rp-accent: #0b6e6e; --rp-line: #d9e1e0; --rp-soft: #f1f6f5; --rp-muted: #5f7372;
  --card: #fff; --card-2: #f4f7f6; --ink: #17282a; --ink-2: #48605f; --muted: #6b7e7d; --line: #e3eaea; --bg: #fff;

{ slug: 'anatomy', cat: 'الركبة والوتر', title: 'تشريح الركبة والجهاز الباسط', desc: 'العضلة الرباعية والرضفة والوتر الرضفي: من يسوي الحركة، ومن يتحمل الحمل.',
html: `<p class="lead">الركبة مو مفصل "ثني ومد" فقط. هي نظام بكرات وحبال ينقل قوة أكبر عضلة بجسمك إلى عظم الساق. فهم هذا النظام هو أساس فهم ليش يوجعك الوتر، وليش التمارين اللي تسويها مصممة بهذا الشكل.</p>
<figure>${KNEE_SVG}<figcaption>رسم جانبي مبسّط للجهاز الباسط للركبة <span class="en">(Knee extensor mechanism)</span>.</figcaption></figure>
<h2>السلسلة من الأعلى للأسفل</h2>
<ol>
<li><b>العضلة الرباعية</b> <span class="en">(Quadriceps femoris)</span>: أربع رؤوس، هي المستقيمة الفخذية <span class="en">(Rectus femoris)</span>، والمتسعة الوحشية <span class="en">(Vastus lateralis)</span>، والمتسعة الإنسية <span class="en">(Vastus medialis / VMO)</span>، والمتسعة المتوسطة <span class="en">(Vastus intermedius)</span>. الضمور اللي لاحظته بالجهة الداخلية للفخذ هو بالمتسعة الإنسية، وهي أول عضلة تضمر لما تتوقف عن التحميل أو يكون عندك ألم بالركبة.</li>
<li><b>وتر الرباعية</b> <span class="en">(Quadriceps tendon)</span>: يربط العضلة بالحافة العلوية للرضفة.</li>
<li><b>الرضفة</b> <span class="en">(Patella)</span>: عظمة سمسمانية داخل الوتر. تشتغل مثل البكرة: تبعد خط سحب العضلة عن محور المفصل، فتزيد ذراع القوة وتخلي الرباعية أكفأ.</li>
<li><b>الوتر الرضفي</b> <span class="en">(Patellar tendon)</span>: طوله تقريباً 4–5 سم، ويمتد من القطب السفلي للرضفة إلى حدبة عظم الساق <span class="en">(Tibial tuberosity)</span>. تشريحياً يربط عظم بعظم، لكن وظيفياً هو وتر ينقل قوة العضلة.</li>
</ol>
<h2>مما يتكون الوتر؟</h2>
<p>الوتر حبل من الكولاجين نوع 1 <span class="en">(Type I collagen)</span>، مرتب بتسلسل هرمي: ألياف دقيقة ← ألياف ← حزم <span class="en">(fibrils → fibres → fascicles)</span>. بين الحزم خلايا اسمها الخلايا الوترية <span class="en">(Tenocytes)</span>، وهي اللي "تحس" بالحمل وتقرر تبني كولاجين جديد أو تكسره.</p>
<p>تروية الوتر الدموية ضعيفة مقارنة بالعضلة، وعدد خلاياه قليل. لهذا العضلة تتكيف خلال أسابيع، أما الوتر فيحتاج <b>أشهر</b>. هذي أهم حقيقة بكل رحلة علاجك.</p>
<h2>كم حمل يتحمل الوتر الرضفي؟</h2>
<p>الحمل على الوتر الرضفي يزيد كلما زاد ثني الركبة تحت وزن الجسم، وبالقفز والهبوط يوصل لعدة أضعاف وزن الجسم. ثلاثة أشياء ترفع الحمل بشكل كبير:</p>
<ul><li><b>زاوية الثني</b>: كل ما نزلت أعمق (سكوات عميق، سجود، جلوس على الأرض) زاد الحمل والضغط على الوتر عند الرضفة.</li>
<li><b>السرعة وتخزين الطاقة</b>: القفز وتغيير الاتجاه بالطوبة يستخدمون الوتر مثل النابض، وهذا أعلى أنواع الحمل.</li>
<li><b>وزن الجسم</b>: كل كيلو زائد ينضرب بعدة أضعاف على الوتر بكل خطوة ودرجة.</li></ul>
<div class="box"><b>ربط بقصتك:</b> اللعب بالطوبة (قفز وتغيير اتجاه)، وليك برس بـ 360 باوند، وبعدها 20 ركعة تراويح يومياً (عشرات المرات من الثني العميق تحت وزن الجسم)، ومعها زيادة الوزن من 69 إلى 85. كلها حمل متراكم على نفس الوتر، وأسرع من قدرته على التكيف.</div>
<h3>المصادر</h3><ul class="refs"><li>Malliaras P, et al. Patellar tendinopathy: clinical diagnosis, load management, and advice for challenging case presentations. JOSPT. 2015;45(11):887–898.</li><li>Magnusson SP, Kjaer M. The impact of loading, unloading, ageing and injury on the human tendon. J Physiol. 2019;597(5):1283–1298.</li></ul>`},

{ slug: 'tendinopathy', cat: 'الركبة والوتر', title: 'شنو هو التهاب الوتر الرضفي فعلاً؟', desc: 'ليش العلماء صاروا يسمونه "اعتلال" مو "التهاب"، ونموذج المراحل الثلاث.',
html: `<p class="lead">اسمه الشائع "ركبة القافز" <span class="en">(Jumper's knee)</span>. الطب الحديث يسميه <b>اعتلال الوتر الرضفي</b> <span class="en">(Patellar tendinopathy)</span>، لأن الفحوصات بالحالات المزمنة تبيّن خلايا التهابية قليلة. المشكلة الأساسية هي <b>خلل بإعادة بناء الوتر</b> نتيجة حمل يفوق قدرته.</p>
<h2>نموذج الاستمرارية (Continuum model)</h2>
<p>اقترحه Cook و Purdam سنة 2009، ويقسم الحالة لثلاث مراحل متداخلة:</p>
<table><thead><tr><th>المرحلة</th><th>شنو يصير بالوتر</th><th>الصورة السريرية</th></tr></thead><tbody>
<tr><td><b>تفاعلية</b> <span class="en">(Reactive)</span></td><td>الوتر ينتفخ ويتغير الماء والبروتينات بداخله، رد فعل لحمل مفاجئ.</td><td>ألم حاد بعد زيادة مفاجئة بالحمل. قابل للرجوع بالكامل.</td></tr>
<tr><td><b>خلل الترميم</b> <span class="en">(Disrepair)</span></td><td>محاولة ترميم غير منظمة، وألياف الكولاجين تصير أقل ترتيب.</td><td>ألم متكرر مع الحمل. ما زال قابل للتحسن بشكل كبير.</td></tr>
<tr><td><b>تنكسية</b> <span class="en">(Degenerative)</span></td><td>مناطق من الوتر تغيرت بنيتها ("متآكلة").</td><td>حالة مزمنة. المناطق المتغيرة ما ترجع مثل ما كانت، لكن الوتر يكدر يتحسن وظيفياً.</td></tr>
</tbody></table>
<div class="box"><b>"متآكل" مو معناها "خربان":</b> الأبحاث تبيّن إن الوتر المتغير يبقى بيه نسيج سليم كافي حوله. الهدف إنك تقوّي هذا النسيج السليم ليش يتحمل أكثر، وهذا يسمونه "علاج الدونات مو الفتحة" <span class="en">(treat the donut, not the hole)</span>. الصورة الشعاعية ما تحدد الألم ولا الأداء، القدرة على التحمل هي اللي تحدد.</div>
<h2>علامات الاعتلال الرضفي</h2>
<ul><li>ألم موضعي بالقطب السفلي للرضفة، تكدر تأشر عليه بإصبع.</li>
<li>الألم مرتبط بالحمل: يبدي مع الحمل ويخف لما توقف. أحياناً يخف بالإحماء، ويرجع أقوى بعد النشاط أو باليوم الثاني.</li>
<li>تيبّس الصبح أو بعد الجلوس الطويل.</li>
<li>صعوبة بالدرج نزولاً، والسكوات، والقفز.</li></ul>
<h2>عوامل الخطر</h2>
<p>زيادة مفاجئة بالحمل (أهم عامل)، والرياضات اللي بيها قفز، وضعف الرباعية والحوض، وزيادة الوزن، وقلة مرونة عضلات الفخذ الخلفية والرباعية والسمانة.</p>
<p><b>ليش الراحة التامة ما تعالجه؟</b> الراحة تخفف الألم مؤقتاً، لكنها تنزّل قدرة الوتر أكثر. فأول ما ترجع للنشاط يكون الوتر أضعف من قبل، وهذا بالضبط اللي شخّصه د. أصيل: "قدرتك التحملية نازلة". العلاج هو <b>الحمل المضبوط</b> مو الراحة.</p>
<h3>المصادر</h3><ul class="refs"><li>Cook JL, Purdam CR. Is tendon pathology a continuum? Br J Sports Med. 2009;43(6):409–416.</li><li>Cook JL, et al. Revisiting the continuum model of tendon pathology. Br J Sports Med. 2016;50(19):1187–1191.</li><li>Docking SI, Cook J. Pathological tendons maintain sufficient aligned fibrillar structure on ultrasound tissue characterization. Scand J Med Sci Sports. 2016;26(6):675–683.</li></ul>`},

{ slug: 'loading', cat: 'العلاج الطبيعي', title: 'ليش التحميل التدريجي هو العلاج؟', desc: 'كيف يتحول الحمل الميكانيكي لكولاجين جديد، ومراحل التأهيل الأربع.',
html: `<p class="lead">الوتر نسيج حي "يسمع" الحمل. لما يتعرض لشد مناسب، الخلايا الوترية تترجم الإشارة الميكانيكية إلى أوامر كيميائية تبني كولاجين جديد. هذي العملية اسمها <b>التحويل الميكانيكي</b> <span class="en">(Mechanotransduction)</span>، وهي اللي يعتمد عليها برنامجك بالكامل.</p>
<figure>${LOAD_SVG}<figcaption>الهدف: يبقى الحمل اليومي (المتقطع) تحت خط قدرة الوتر، بينما الخط يرتفع تدريجياً. القفزات المفاجئة هي اللي تسبب الانتكاسات.</figcaption></figure>
<h2>بعد كل جلسة تمرين</h2>
<p>الدراسات على الأوتار تبيّن إن الحمل يرفع <b>بناء</b> الكولاجين ويرفع <b>تكسيره</b> بنفس الوقت. التكسير يغلب بالساعات الأولى، والبناء يغلب لاحقاً. يعني الوتر بعد الحمل الثقيل "أضعف مؤقتاً"، ويحتاج وقت حتى يطلع أقوى. لهذا التمارين الثقيلة بالمراحل المتقدمة تكون يوم ويوم لا، أما الخفيفة والثابتة فممكن تكون يومية.</p>
<h2>المراحل الأربع للتأهيل</h2>
<p>البروتوكولات الحديثة لاعتلال الوتر الرضفي تمشي على أربع مراحل، والانتقال بينها حسب الأعراض مو حسب التاريخ:</p>
<ol>
<li><b>التمارين الثابتة</b> <span class="en">(Isometric)</span>: تقلّص بدون حركة، مثل Quad 60° لمدة 45 ثانية. تخفف الألم عند كثير من المرضى، وتبدي تحميل الوتر بأمان. <i>(أنت خلصتها.)</i></li>
<li><b>التقوية الديناميكية</b> <span class="en">(Isotonic)</span>: حركة كاملة مع مقاومة، مثل TKE وStep Down وتمارين الحوض بالحبل. الهدف تبني قوة الرباعية والحوض. <i>(أنت هنا.)</i></li>
<li><b>تخزين الطاقة</b> <span class="en">(Energy storage)</span>: قفز خفيف، حبل، هبوط، تغيير اتجاه، مع زيادة تدريجية بالسرعة.</li>
<li><b>العودة للرياضة</b> <span class="en">(Return to sport)</span>: تمارين خاصة بالطوبة، ثم تدريب كامل، ثم مباريات.</li></ol>
<div class="box">تجربة سريرية عشوائية (Breda وزملاؤه 2021) قارنت هذا البرنامج التدريجي بالتمارين اللامركزية التقليدية. النتيجة: البرنامج التدريجي أعطى تحسن أكبر بالأعراض، ونسبة أعلى من الرياضيين رجعوا للعب.</div>
<h2>ليش يمكن تحس إنك جاهز قبل لا تكون جاهز؟</h2>
<p>العضلة تقوى خلال أسابيع، والوتر يحتاج من 3 إلى 6 أشهر وأكثر. فبالأسابيع الأولى تحس رجلك قوية، فتزيد الحمل، وهنا يرجع الألم. هذي أشهر سبب للانتكاسة. <b>القاعدة: لا تقيس جاهزيتك بإحساس العضلة. قيسها بألم الصبح.</b></p>
<h3>المصادر</h3><ul class="refs"><li>Malliaras P, et al. Patellar tendinopathy: clinical diagnosis, load management... JOSPT. 2015;45(11):887–898.</li><li>Breda SJ, et al. Effectiveness of progressive tendon-loading exercise therapy in patients with patellar tendinopathy: a randomised clinical trial. Br J Sports Med. 2021;55(9):501–509.</li><li>Rio E, et al. Isometric exercise induces analgesia and reduces inhibition in patellar tendinopathy. Br J Sports Med. 2015;49(19):1277–1283.</li><li>Kongsgaard M, et al. Corticosteroid injections, eccentric decline squat training and heavy slow resistance training in patellar tendinopathy. Scand J Med Sci Sports. 2009;19(6):790–802.</li><li>Magnusson SP, Langberg H, Kjaer M. The pathogenesis of tendinopathy: balancing the response to loading. Nat Rev Rheumatol. 2010;6(5):262–268.</li></ul>`},

{ slug: 'pain-monitoring', cat: 'العلاج الطبيعي', title: 'مراقبة الألم: البوصلة اليومية', desc: 'شلون تقرا ألمك، وليش ألم الصبح أهم رقم بالسجل.',
html: `<p class="lead">بعلاج الأوتار، الألم مو عدو لازم تتجنبه بالكامل، ولا هو إذن تتجاهله. هو <b>مقياس</b> يقول لك إذا الحمل مناسب لقدرة الوتر الحالية.</p>
<h2>مقياس الألم الرقمي (NRS 0–10)</h2>
<table><tbody><tr><td><b>0</b></td><td>لا ألم</td></tr><tr><td><b>1–2</b></td><td>إحساس خفيف، تنتبه له إذا ركزت</td></tr><tr><td><b>3–4</b></td><td>ألم واضح لكن ما يغير طريقة حركتك</td></tr><tr><td><b>5–6</b></td><td>ألم يخليك تعدّل الحركة أو تعرج</td></tr><tr><td><b>7–10</b></td><td>ألم قوي يوقف النشاط</td></tr></tbody></table>
<h2>نموذج مراقبة الألم</h2>
<p>طوّرته Silbernagel وزملاؤها لعلاج أوتار أكيليس، وصار يُستخدم بكل اعتلالات الأوتار. يعتمد على ثلاث قراءات:</p>
<ol><li><b>أثناء التمرين</b>: هل بقي ضمن الحد المسموح؟</li><li><b>بعد التمرين مباشرة</b>: هل رجع بسرعة؟</li><li><b>صباح اليوم التالي</b>: هذا أهم رقم. يبيّن استجابة الوتر خلال 24 ساعة. إذا ألم الصبح أعلى من المعتاد، فالحمل أمس كان أكثر من قدرة الوتر.</li></ol>
<div class="box"><b>حدودك من د. أصيل:</b> بالمرحلة الأولى كان الحد 2 من 10، وبالمرحلة الثانية صفر. هذي حدود أشد من البروتوكولات العامة (اللي تسمح أحياناً بـ 5 من 10)، وهو اختيار الدكتور حسب حالتك. التطبيق يلتزم بحدوده ويلوّن أي رقم فوقها.</div>
<h2>شلون تتصرف حسب الألم؟</h2>
<ul><li><b>ضمن الحد، وألم الصبح طبيعي يومين متتاليين:</b> ممكن تزيد الحمل شوي (خطوات أو تكرارات)، حسب توجيه الدكتور.</li>
<li><b>فوق الحد أثناء تمرين معيّن:</b> خفف المدى أو المقاومة لهذا التمرين بس، وسجّل ملاحظة.</li>
<li><b>ألم الصبح أعلى من المعتاد:</b> ارجع لحمل اليوم اللي قبله، وما تزيد شي لحد ما يرجع.</li>
<li><b>ألم حاد مفاجئ أو انتفاخ أو أعراض عصبية:</b> وقف، وراسل الدكتور.</li></ul>
<h3>المصادر</h3><ul class="refs"><li>Silbernagel KG, et al. Continued sports activity, using a pain-monitoring model, during rehabilitation in patients with Achilles tendinopathy. Am J Sports Med. 2007;35(6):897–906.</li><li>Malliaras P, et al. JOSPT. 2015;45(11):887–898.</li></ul>`},

{ slug: 'kinetic-chain', cat: 'العلاج الطبيعي', title: 'ليش الدكتور بدأ بالحوض مو بالركبة؟', desc: 'السلسلة الحركية: الورك والكاحل يتحكمون بكمية الحمل الواصل للركبة.',
html: `<p class="lead">الركبة مفصل "وسطي" محصور بين الورك والكاحل. حركتها محدودة تقريباً بالثني والمد، فأي ضعف فوق أو تحت ينعكس عليها. مثل ما قال لك د. أصيل: اللي يحدد حركة الركبة هي عضلات الحوض، والرباعية، والكاحل.</p>
<h2>الورك (الحوض)</h2>
<p>عضلات المبعدات <span class="en">(Gluteus medius)</span> والمدوّرات الخارجية تمنع الفخذ إنه "يطيح" للداخل ويدور وقت المشي والنزول من الدرج. هذا الانهيار يسمونه <b>الانحراف الديناميكي للداخل</b> <span class="en">(Dynamic knee valgus)</span>. يغيّر اتجاه سحب الرباعية على الرضفة، ويوزع الحمل على الوتر بشكل غير متوازن.</p>
<p>تمارين مثل <span class="en">Clam Shells</span> و<span class="en">Hip Abduction</span> تقوي هذي العضلات. والإحساس اللي ذكرته بإن الأرداف كبرت دليل إن العضلة استجابت فعلاً 😊.</p>
<h2>الرباعية</h2>
<p>الرباعية القوية تمتص الصدمة وتتحكم بالنزول. لما تضعف، الوتر ياخذ جزء أكبر من الحمل. لهذا تمارين <span class="en">TKE</span> و<span class="en">SLR</span> و<span class="en">Quad 60°</span> تستهدف بشكل خاص المتسعة الإنسية (VMO) اللي لاحظت ضمورها.</p>
<h2>الكاحل</h2>
<p>إذا انثناء الكاحل للأعلى <span class="en">(Ankle dorsiflexion)</span> محدود، الجسم يعوّض بزيادة الثني بالركبة، فيزيد الحمل على الوتر. لهذا مرونة السمانة وقوتها جزء من المراحل اللاحقة.</p>
<h2>تمرين Step Down مع الركبة فوق أصابع القدم</h2>
<p>سنين نسمع "لا تخلي ركبتك تعدّي أصابع رجلك". الحقيقة إن الركبة تعدّي الأصابع طبيعياً بالدرج والجلوس والسجود. الهدف من هذا التمرين <b>تدريب الوتر على تحمّل هذا الوضع</b> بشكل مضبوط وتدريجي، حتى ما يصير "منطقة ممنوعة" يتعب فيها الوتر كل مرة تنزل درجة.</p>
<h3>المصادر</h3><ul class="refs"><li>Powers CM. The influence of abnormal hip mechanics on knee injury: a biomechanical perspective. JOSPT. 2010;40(2):42–51.</li><li>Malliaras P, et al. JOSPT. 2015;45(11):887–898.</li><li>Backman LJ, Danielson P. Low range of ankle dorsiflexion predisposes for patellar tendinopathy in junior elite basketball players. Am J Sports Med. 2011;39(12):2626–2633.</li></ul>`},

{ slug: 'energy', cat: 'التغذية', title: 'الطاقة: شلون يحرق جسمك السعرات؟', desc: 'BMR وTDEE والخطوات، وليش 7700 سعرة ≈ 1 كغم دهون.',
html: () => { const e = energy(); const p = D.profile; const w = currentWeight(); return `<p class="lead">الوزن بالنهاية معادلة طاقة: الداخل (الأكل) مقابل الخارج (الحرق). المعادلة بسيطة، أما مكوناتها فيها تفاصيل مهمة.</p>
<h2>مكونات الحرق اليومي (TDEE)</h2>
<table><tbody>
<tr><td><b>الأيض الأساسي</b> <span class="en">(BMR)</span></td><td>60–70%</td><td>تشغيل القلب والدماغ والأعضاء وانت مرتاح.</td></tr>
<tr><td><b>هضم الأكل</b> <span class="en">(TEF)</span></td><td>~10%</td><td>البروتين يحتاج طاقة أكثر بهضمه (20–30% من سعراته).</td></tr>
<tr><td><b>النشاط غير الرياضي</b> <span class="en">(NEAT)</span></td><td>15–30%</td><td>المشي، الوقوف، الحركة اليومية. هنا دور خطواتك.</td></tr>
<tr><td><b>التمرين</b> <span class="en">(EAT)</span></td><td>5–10%</td><td>تمارين العلاج نفسها حرقها قليل، فائدتها ببناء القوة.</td></tr></tbody></table>
<h2>حساباتك الحالية</h2>
<p>معادلة Mifflin-St Jeor للرجال: <span class="en">BMR = 10×W + 6.25×H − 5×A + 5</span></p>
<p>= 10×${fmtN(w, 1)} + 6.25×${p.height} − 5×${p.age} + 5 = <b>${fmtN(e.bmr)}</b> سعرة.</p>
<p>× معامل النشاط ${p.activity} = <b>${fmtN(e.tdee)}</b> سعرة باليوم. ناقص عجز ${p.deficit} = هدفك <b>${fmtN(e.target)}</b> سعرة.</p>
<h2>الخطوات: كم تحرق؟</h2>
<p>المشي يحرق تقريباً 0.5 سعرة لكل كغم من وزنك لكل كيلومتر (فوق الحرق الأساسي). بوزن ${fmtN(w)} كغم، 7000 خطوة (≈ 5 كم) تحرق تقريباً <b>${fmtN(0.5 * w * 5)}</b> سعرة إضافية. رقم مفيد، لكنه أقل مما يتخيل الناس، لهذا <b>الأكل هو الأداة الرئيسية</b> لنزول الوزن بمرحلتك.</p>
<h2>7700 سعرة = 1 كغم؟</h2>
<p>الكيلو من الدهون يخزن تقريباً 7700 سعرة. فعجز 500 سعرة يومياً ≈ 3500 بالأسبوع ≈ نص كيلو دهون. عملياً النزول يكون أسرع بالبداية (ماء وغلايكوجين) وأبطأ لاحقاً، لأن الجسم يقلل حرقه شوي مع نزول الوزن <span class="en">(Adaptive thermogenesis)</span>.</p>
<div class="box"><b>الميزان يكذب يومياً:</b> وزنك يتذبذب 0.5–1.5 كغم حسب الماء والملح والأكل. لا تحكم على يوم واحد. شوف اتجاه المعدل الأسبوعي بصفحة التقدم.</div>
<h3>المصادر</h3><ul class="refs"><li>Mifflin MD, et al. A new predictive equation for resting energy expenditure in healthy individuals. Am J Clin Nutr. 1990;51(2):241–247.</li><li>Hall KD, et al. Quantification of the effect of energy imbalance on bodyweight. Lancet. 2011;378(9793):826–837.</li></ul>`; }},

{ slug: 'macros', cat: 'التغذية', title: 'البروتين والكارب والدهون', desc: 'شنو يسوي كل واحد، وكم تحتاج، وشلون توزعه على 3 وجبات.',
html: () => { const e = energy(); return `<p class="lead">كل سعرة تجي من واحد من ثلاث مصادر كبرى <span class="en">(Macronutrients)</span>. نوع السعرة يحدد شنو ينبني بجسمك وشنو ينحرق.</p>
<table><thead><tr><th></th><th>سعرات/غرام</th><th>دوره الرئيسي</th><th>هدفك</th></tr></thead><tbody>
<tr><td><b>البروتين</b></td><td>4</td><td>بناء العضل والكولاجين والإنزيمات. الأكثر إشباعاً.</td><td class="num">${e.protein} غ</td></tr>
<tr><td><b>الكاربوهيدرات</b></td><td>4</td><td>وقود المشي والتمارين والدماغ. يحفظ البروتين من الحرق.</td><td class="num">~${Math.max(0, e.carbs)} غ</td></tr>
<tr><td><b>الدهون</b></td><td>9</td><td>الهرمونات (منها التستوستيرون)، وامتصاص فيتامين D وA وE وK.</td><td class="num">~${e.fat} غ</td></tr></tbody></table>
<h2>البروتين: الأهم بمرحلتك</h2>
<p>العضل ينبني ويتكسر يومياً. لما تكون بعجز سعرات، الجسم يميل يكسر العضل للطاقة، إلا إذا وصلت له إشارتين: <b>تمرين مقاومة</b> و<b>بروتين كافي</b>.</p>
<ul><li>الأبحاث تحدد ~1.6 غ/كغم كحد يتوقف بعده الفائدة بالظروف العادية، و2.0–2.2 أو أكثر بالعجز الشديد عند الرياضيين.</li>
<li>كل وجبة تحتاج ~0.4 غ/كغم (يعني 30–40 غ) حتى تشغّل بناء العضل بأقصى طاقته. هذا يسمونه عتبة الليوسين <span class="en">(Leucine threshold)</span>.</li>
<li>عندك 3 وجبات، فالهدف تقريباً <b>${Math.round(e.protein / 3)} غ بروتين بكل وجبة</b>.</li></ul>
<h2>مصادر البروتين ببيتكم</h2>
<table><thead><tr><th>الغذاء</th><th>الكمية</th><th>بروتين</th></tr></thead><tbody>
<tr><td>بيض</td><td>3 بيضات</td><td class="num">~19 غ</td></tr><tr><td>صدر دجاج</td><td>150 غ مطبوخ</td><td class="num">~46 غ</td></tr><tr><td>سمك</td><td>150 غ</td><td class="num">~37 غ</td></tr><tr><td>تونة بالماء</td><td>علبة (120 غ)</td><td class="num">~31 غ</td></tr><tr><td>لبن مصفى</td><td>200 غ</td><td class="num">~20 غ</td></tr><tr><td>عدس مطبوخ</td><td>كوب (200 غ)</td><td class="num">~18 غ</td></tr><tr><td>جبن أبيض</td><td>50 غ</td><td class="num">~8 غ</td></tr></tbody></table>
<h2>الألياف</h2><p>الخضار اللي تاكلها (باذنجان، شجر، جزر، سلك، خباز) ممتازة: سعرات قليلة وألياف عالية وإشباع. الهدف 25–38 غ ألياف باليوم.</p>
<h3>المصادر</h3><ul class="refs"><li>Morton RW, et al. A systematic review, meta-analysis and meta-regression of the effect of protein supplementation on resistance training-induced gains in muscle mass and strength. Br J Sports Med. 2018;52(6):376–384.</li><li>Schoenfeld BJ, Aragon AA. How much protein can the body use in a single meal for muscle-building? J Int Soc Sports Nutr. 2018;15:10.</li></ul>`; }},

{ slug: 'fatloss', cat: 'التغذية', title: 'تنزيل الدهون مع الحفاظ على العضل', desc: 'ليش العجز الكبير يضرك الآن بالذات، والمعدل الصحيح للنزول.',
html: () => { const e = energy(); const t = ['m_pizza', 'm_chard', 'm_pizza', 'm_tea'].map(mealById).filter(Boolean).reduce((a, m) => { const x = mealTotals(m); a.k += x.kcal; a.p += x.p; return a; }, { k: 0, p: 0 }); return `<p class="lead">الهدف مو "ينزل الوزن". الهدف <b>تنزل الدهون</b> وتبقى العضلات، لأنها هي اللي تحمي ركبتك وترجعك للطوبة.</p>
<h2>المعدل الصحيح</h2>
<p>0.5–1% من وزن الجسم بالأسبوع، يعني لك ~0.4–0.8 كغم. الأسرع من هذا يزيد خسارة العضل بشكل واضح، خصوصاً مع بروتين قليل.</p>
<h2>ليش العجز الكبير خطر عليك الآن بالذات؟</h2>
<div class="box warn">يومك المعتاد تقريباً <b>${fmtN(t.k)} سعرة</b> و<b>${fmtN(t.p)} غ بروتين</b>، وحرقك ~${fmtN(e.tdee)}. يعني عجز ~${fmtN(e.tdee - t.k)} سعرة باليوم. هذا يسبب:
<ul style="margin-bottom:0"><li><b>خسارة عضل</b>: بالضبط العضلات اللي قاعد د. أصيل يبنيها (VMO، الألوية).</li>
<li><b>بطء ترميم الوتر</b>: بناء الكولاجين يحتاج طاقة وأحماض أمينية. قلة توفر الطاقة <span class="en">(Low energy availability)</span> تضعف بناء الكولاجين والعظم.</li>
<li><b>تعب وجوع وانتكاسة</b>: الأنظمة القاسية صعب تستمر عليها، والوزن يرجع.</li></ul></div>
<h2>المعادلة الصحيحة</h2>
<ol><li><b>عجز معتدل</b>: ~${fmtN(e.target)} سعرة (عجز ~${D.profile.deficit}).</li>
<li><b>بروتين عالي</b>: ${e.protein} غ (~${Math.round(e.protein / 3)} غ بكل وجبة).</li>
<li><b>تمارين مقاومة</b>: تمارين د. أصيل هي الإشارة للجسم إنه يحافظ على العضل. لا تتركها بأيام الدايت.</li>
<li><b>نوم 7–9 ساعات</b>: بدراسة معروفة، نفس الدايت مع نوم 5.5 ساعة بدل 8.5 خسّر عضل أكثر ودهون أقل.</li>
<li><b>خطوات ثابتة</b>: ضمن حدود ما يسمح به الدكتور.</li></ol>
<h2>شلون تعرف إنك تخسر دهون مو عضل؟</h2>
<ul><li>محيط الخصر ينزل (سجّله كل جمعة).</li><li>قوتك بالتمارين ثابتة أو تزيد.</li><li>المعدل الأسبوعي للوزن ينزل بهدوء، مو بقفزات.</li></ul>
<h3>المصادر</h3><ul class="refs"><li>Helms ER, et al. A systematic review of dietary protein during caloric restriction in resistance trained lean athletes. Int J Sport Nutr Exerc Metab. 2014;24(2):127–138.</li><li>Garthe I, et al. Effect of two different weight-loss rates on body composition and strength and power-related performance in elite athletes. Int J Sport Nutr Exerc Metab. 2011;21(2):97–104.</li><li>Nedeltcheva AV, et al. Insufficient sleep undermines dietary efforts to reduce adiposity. Ann Intern Med. 2010;153(7):435–441.</li><li>Mountjoy M, et al. IOC consensus statement on relative energy deficiency in sport (RED-S). Br J Sports Med. 2018;52(11):687–697.</li></ul>`; }},

{ slug: 'tendon-nutrition', cat: 'التغذية', title: 'تغذية الوتر: الكولاجين وفيتامين C وD', desc: 'شنو الثابت علمياً وشنو بعده أولي.',
html: `<p class="lead">ماكو غذاء "يعالج" الوتر لوحده. التحميل هو العلاج، والتغذية توفّر مواد البناء. هذا الدرس يفرّق بين الثابت والأولي.</p>
<h2>الثابت</h2>
<ul><li><b>طاقة وبروتين كافيين</b>: الأساس قبل أي مكمل.</li>
<li><b>فيتامين C</b>: ضروري لإنزيمات بناء الكولاجين. الخضار والفواكه تكفي غالباً (طماطة، فلفل، برتقال، كيوي).</li></ul>
<h2>واعد لكن أولي</h2>
<p><b>جيلاتين أو كولاجين + فيتامين C قبل التمرين:</b> دراسة صغيرة (Shaw وزملاؤه 2017) لقت إن 15 غ جيلاتين مع فيتامين C قبل ساعة من تمرين قصير ضاعفت مؤشر بناء الكولاجين بالدم. النتائج مشجعة، لكن ما ثبت للحين إنها تسرّع الشفاء السريري. اسأل الدكتور إذا تحب تجربها.</p>
<h2>فيتامين D</h2>
<p>مهم للعضلات والعظام والمناعة، ونقصه منتشر بالعراق رغم الشمس (الملابس، والبقاء داخل البيت، ولون البشرة).</p>
<div class="box warn"><b>جرعتك 50,000 IU أسبوعياً</b> (تعادل ~7,000 IU يومياً). هذي جرعة علاجية تُستخدم عادة لتعويض النقص لفترة محددة (غالباً 8–12 أسبوع)، وبعدها تتحول لجرعة صيانة. تأكد من الطبيب المعالج عن المدة، وسوِّ تحليل <span class="en">25(OH)D</span> لتعرف مستواك قبل لا تستمر لفترة طويلة. وخذه مع وجبة بيها دهون (مثل بيتزا البيض) حتى يمتص أفضل.</div>
<h2>أوميغا 3</h2><p>بعض الأدلة على تأثير مضاد للالتهاب، لكن الدليل على الأوتار تحديداً ضعيف. السمك مرتين بالأسبوع خيار جيد ويضيف بروتين.</p>
<h3>المصادر</h3><ul class="refs"><li>Shaw G, et al. Vitamin C–enriched gelatin supplementation before intermittent activity augments collagen synthesis. Am J Clin Nutr. 2017;105(1):136–143.</li><li>Holick MF, et al. Evaluation, treatment, and prevention of vitamin D deficiency: an Endocrine Society clinical practice guideline. J Clin Endocrinol Metab. 2011;96(7):1911–1930.</li></ul>`},

  const t = { kcal: 0, p: 0, c: 0, f: 0, any: false };
  for (const mm of log?.meals || []) {
    const m = mealById(mm.m); if (!m) continue;
    const mt = mealTotals(m);
    for (const k of ['kcal', 'p', 'c', 'f']) t[k] += mt[k] * (mm.q || 1);

/* الدورة: 14 يوم تبدأ من آخر استشارة (أو حتى موعد الاستشارة القادمة إن وُجد) */
function currentCycle(date = today()) {
  const lc = lastConsult(date);
  const base = lc ? lc.date : (phasesSorted()[0]?.start || date);
  const n = Math.max(0, Math.floor(diffDays(base, date) / 14));
  const start = addDays(base, n * 14);
  let end = addDays(start, 13);
  const nc = D.profile.nextConsult;
  if (nc && nc > date && nc <= addDays(start, 27)) end = addDays(nc, -1);
  return { start, end, index: n + 1, day: diffDays(start, date) + 1, len: diffDays(start, end) + 1 };
}

  const color = o.color || 'var(--series-1)';
  let g = '';
  for (const t of ticks) g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${fmtN(t, o.dec ?? 0)}</text>`;
  const step = Math.max(1, Math.ceil(n / (o.xTicks || 7)));
  for (let i = 0; i < n; i += step) g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle">${fmtShort(xs[i])}</text>`;
  let marks = '';
  if (o.type === 'bar') {
    const w = Math.min(24, Math.max(3, bw - 4));
    data.forEach((d, i) => {
      if (d.y == null) return;
      const y0 = Y(Math.max(lo, 0)), y1 = Y(d.y), h = Math.max(1, y0 - y1), x = X(i) - w / 2, r = Math.min(4, w / 2, h);
      const c = d.c || color;
      marks += `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + w - r} Q${x + w},${y1} ${x + w},${y1 + r} V${y0} Z" fill="${c}"/>`;
    });
  } else {
    (o.series || [{ key: 'y', color, name: o.name }]).forEach(s => {
      let path = '', pen = false; const dots = [];
      data.forEach((d, i) => {
        const v = d[s.key]; if (v == null) { if (!o.connect) pen = false; return; }
        path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true;
        dots.push([X(i), Y(v), d[s.key + 'c']]);
      });
      if (s.area && path) marks += `<path d="${path} L${dots.at(-1)[0]},${pt + ih} L${dots[0][0]},${pt + ih} Z" fill="${s.color}" opacity=".1"/>`;
      if (!s.dotsOnly) marks += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const showDots = s.dotsOnly || dots.length <= 31;
      if (showDots) dots.forEach(([x, y, c]) => marks += `<circle cx="${x}" cy="${y}" r="4" fill="${c || s.color}" stroke="var(--card)" stroke-width="2"/>`);
      else if (dots.length) { const [x, y] = dots.at(-1); marks += `<circle cx="${x}" cy="${y}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`; }
    });
  }
  let rl = '';
  for (const r of refs) {
    rl += `<line x1="${pl}" x2="${W - pr}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color || 'var(--ink-2)'}" stroke-width="1.5" stroke-dasharray="${r.dash || '5 4'}"/>`;
    rl += `<text class="ax" x="${W - pr}" y="${Y(r.y) - 5}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">${esc(r.label)}</text>`;
  }
  CHARTS[id] = { data, X: data.map((_, i) => X(i)), W, H, tip: o.tip, pt, ih };
  return `<div class="chart" id="${id}" role="img" aria-label="${esc(o.label || '')}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="direction:ltr">${g}${marks}${rl}<line class="hov" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/></svg><div class="tip"></div></div>`;
}
function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1, 2, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const a = Math.floor(lo / st) * st, out = [];
  for (let v = a; v <= hi + st * .001; v += st) out.push(+v.toFixed(6));
  if (out.at(-1) < hi) out.push(out.at(-1) + st);
  return out;
}
function bindCharts(root = document) {
  $$('.chart', root).forEach(el => {
    const c = CHARTS[el.id]; if (!c || el.dataset.b) return; el.dataset.b = 1;
    const svg = $('svg', el), tip = $('.tip', el), hov = $('.hov', el);
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * c.W;
      let bi = 0, bd = 1e9; c.X.forEach((px, i) => { const d = Math.abs(px - x); if (d < bd) { bd = d; bi = i; } });
      const d = c.data[bi];
      const html = c.tip ? c.tip(d) : `${fmtD(d.x)}: ${fmtN(d.y, 1)}`;
      if (!html) { tip.classList.remove('show'); return; }
      tip.innerHTML = html;
      const px = c.X[bi] / c.W * r.width;
      tip.style.right = 'auto';
      tip.style.left = Math.min(Math.max(px, 70), r.width - 70) + 'px';
      tip.style.transform = 'translate(-50%, -105%)';
      tip.style.top = '0px';
      tip.classList.add('show');
      hov.setAttribute('x1', c.X[bi]); hov.setAttribute('x2', c.X[bi]); hov.setAttribute('opacity', .4);
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', () => { tip.classList.remove('show'); hov.setAttribute('opacity', 0); });
  });
}

let toastT;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function dialog({ title, body, actions }) {
  const dl = document.createElement('dialog');
  dl.innerHTML = `<div class="dh">${esc(title)}</div><div class="db">${body}</div><div class="df"></div>`;
  for (const a of actions) {
    const b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = async () => { const r = a.run ? await a.run(dl) : true; if (r !== false) { dl.close(); dl.remove(); } };
    $('.df', dl).append(b);
  }
  document.body.append(dl); dl.showModal();
  dl.addEventListener('cancel', () => setTimeout(() => dl.remove(), 50));
  return dl;
}
function formDialog({ title, fields, values = {}, onSave, onDelete, saveLabel = 'حفظ' }) {
  const body = fields.map(f => {
    const v = values[f.k] ?? f.def ?? '';
    const id = 'fd_' + f.k;
    if (f.type === 'textarea') return `<label class="f" style="margin-bottom:12px">${esc(f.label)}<textarea id="${id}">${esc(v)}</textarea></label>`;
    if (f.type === 'select') return `<label class="f" style="margin-bottom:12px">${esc(f.label)}<select id="${id}">${f.options.map(([ov, ol]) => `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select></label>`;
    if (f.type === 'checkbox') return `<label class="row" style="margin-bottom:12px"><input type="checkbox" id="${id}" ${v ? 'checked' : ''} style="width:22px;height:22px"> ${esc(f.label)}</label>`;
    return `<label class="f" style="margin-bottom:12px">${esc(f.label)}<input id="${id}" type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(v)}" ${f.dir ? `dir="${f.dir}"` : ''}></label>`;
  }).join('') + (f => f ? `<p class="muted">${f}</p>` : '')(fields.note);
  const actions = [];
  if (onDelete) actions.push({ label: 'حذف', cls: 'danger', run: () => { if (confirm('متأكد من الحذف؟')) { onDelete(); return true; } return false; } });
  actions.push({ label: 'إلغاء' });
  actions.push({
    label: saveLabel, cls: 'primary', run: dl => {
      const out = {};
      for (const f of fields) {
        const el = $('#fd_' + f.k, dl);
        out[f.k] = f.type === 'checkbox' ? el.checked : f.type === 'number' ? num(el.value) : el.value.trim();
      }
      return onSave(out);
    }
  });
  return dialog({ title, body, actions });
}

        <div class="chips">${tpls.map(m => `<button type="button" class="chip" data-meal="${m.id}" aria-pressed="${chosen.some(c => c.m === m.id)}">${esc(m.name)}</button>`).join('')}</div>
        ${chosen.map(c => { const m = mealById(c.m); if (!m) return ''; return `<div class="meal-line"><span style="flex:1">${esc(m.name)}</span><span class="muted">الكمية</span>
          <span class="stepper" data-q="${c.m}"><button type="button" data-d="-0.5">−</button><input type="number" step="0.5" min="0" value="${c.q}"><button type="button" data-d="0.5">+</button></span></div>`; }).join('')}
      </div>`;
    }).join('');
    const n = dayNutrition(log);
    const extras = (log.extra || []).map((x, i) => { const f = foodById(x.f); return `<div class="meal-line" data-xi="${i}"><span style="flex:1">${esc(f?.name || x.f)}</span><span class="num">${f?.unitG ? r1(x.g / f.unitG) + ' ' + f.unit : x.g + ' غ'}</span><span class="muted num">${fmtN(f ? f.kcal * x.g / 100 : 0)} سعرة</span><button class="btn sm iconbtn danger" data-delx="${i}" aria-label="حذف">${ic('trash')}</button></div>`; }).join('');

    return `
    <div class="page-head"><div><h1>السجل اليومي</h1><p>${weekday(d)} ${fmtD(d, { day: 'numeric', month: 'long', year: 'numeric' })} · ${hijri(d)}</p></div>
      <div class="datebar"><a class="btn iconbtn" href="#log/${addDays(d, -1)}" aria-label="اليوم السابق">${ic('prev')}</a>
      <input type="date" id="logDate" value="${d}" max="${addDays(today(), 1)}">
      <a class="btn iconbtn" href="#log/${addDays(d, 1)}" aria-label="اليوم التالي">${ic('next')}</a>
      ${d !== today() ? `<a class="btn sm" href="#log/${today()}">اليوم</a>` : ''}<span class="saved" id="saved">${ic('check', 'width="14" height="14"')} حُفظ</span></div></div>

    <div class="grid g2" style="align-items:start">
      <div class="stack">
        <section class="card"><h2><span>التمارين العلاجية</span><span class="pill acc">${esc(ph ? ph.name.split('—')[0].trim() : 'لا توجد مرحلة')}</span></h2>
          ${exs.length ? `<div class="row" style="margin-bottom:6px"><button class="btn sm" id="allDone">${ic('check')} أنجزت الكل</button><button class="btn sm" id="clearEx">مسح</button><span class="muted">اضغط مرة = تم، مرتين = ما سويته، ثلاث = بدون تسجيل</span></div>${exRows}` : '<p class="muted">لا توجد مرحلة علاجية بهذا التاريخ.</p>'}
        </section>
        <section class="card"><h2><span>ألم الوتر الرضفي</span><span class="pill ${lim === 0 ? 'ok' : 'warn'}">الحد ${lim} من 10</span></h2>
          ${scale('painDuring', 'أعلى ألم أثناء/بعد التمارين', '')}
          ${scale('painMorning', 'ألم الصبح (أول خطوات بعد النوم)', 'هذا أهم مؤشر: يبيّن استجابة الوتر للحمل خلال 24 ساعة')}
          ${scale('painDaily', 'ألم النشاط اليومي (درج، جلوس طويل، مشي)', '')}
          <div id="painAlert"></div>
        </section>
        <section class="card"><h2>ملاحظات اليوم</h2>
          <textarea id="notes" placeholder="أي إحساس، مكان الألم، تمرين صعب، شي تريد تسأل عنه الدكتور...">${esc(log.notes || '')}</textarea>
          <label class="row" style="margin-top:8px"><input type="checkbox" id="flag" ${log.flag ? 'checked' : ''} style="width:20px;height:20px"> مهمة للدكتور (تظهر مميّزة بالتقرير)</label>
        </section>
      </div>
      <div class="stack">
        <section class="card"><h2>الحركة والجسم</h2>
          <div class="grid g2">
            <label class="f">الخطوات (من Fitbit)<input type="number" inputmode="numeric" id="steps" value="${log.steps ?? ''}" placeholder="مثلاً 7000"></label>
            <label class="f">الوزن (كغم)<input type="number" inputmode="decimal" step="0.1" id="weight" value="${log.weight ?? ''}" placeholder="آخر وزن ${fmtN(currentWeight(), 1)}"></label>
            <label class="f">النوم (ساعات)<input type="number" inputmode="decimal" step="0.5" id="sleep" value="${log.sleep ?? ''}"></label>
            <label class="f">محيط الخصر (سم، أسبوعي)<input type="number" inputmode="decimal" step="0.5" id="waist" value="${log.waist ?? ''}"></label>
          </div>
          <div class="row" style="margin-top:14px"><span class="f" style="font-size:13px;color:var(--ink-2)">الماء (لتر)</span>
            <span class="stepper" id="water"><button type="button" data-d="-0.25">−</button><input type="number" step="0.25" min="0" value="${log.water ?? 0}"><button type="button" data-d="0.25">+</button></span>
            <span class="muted">الهدف ${p.waterTarget} لتر</span></div>
          <label class="row" style="margin-top:14px;${isFriday(d) ? 'font-weight:600' : ''}"><input type="checkbox" id="vitD" ${log.vitD ? 'checked' : ''} style="width:22px;height:22px"> أخذت فيتامين D (50,000 IU) ${isFriday(d) ? '<span class="pill acc">اليوم جمعة</span>' : ''}</label>
        </section>
        <section class="card"><h2><span>الأكل</span><button class="btn sm" id="usual">أكلي المعتاد</button></h2>
          ${slots}
          <div class="meal-slot"><h4><span>أكل إضافي (بالغرام أو الحبة)</span></h4>
            ${extras}
            <div class="meal-line"><select id="xFood" style="flex:2;min-width:150px">${D.foods.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>
            <input type="number" id="xAmt" inputmode="decimal" placeholder="الكمية" style="flex:1;min-width:80px"><span class="muted" id="xUnit"></span>
            <button class="btn sm" id="xAdd">${ic('plus')} إضافة</button></div>
          </div>
          <div class="sumbar" style="margin-top:12px">
            <div><b class="num">${fmtN(n.kcal)}</b><span>سعرة تقديرية / ${fmtN(e.target)}</span></div>
            <div><b class="num">${fmtN(n.p)}</b><span>بروتين تقديري (غ) / ${e.protein}</span></div>
            <div><b class="num">${fmtN(n.c)}</b><span>كاربوهيدرات (غ)</span></div>
            <div><b class="num">${fmtN(n.f)}</b><span>دهون (غ)</span></div>
          </div>
          <div class="grid g2" style="margin-top:12px">
            <label class="f">البروتين حسب حسابك (غ) — اختياري<input type="number" inputmode="numeric" id="protein" value="${log.protein ?? ''}" placeholder="${fmtN(n.p)}"></label>
            <label class="f">السعرات حسب حسابك — اختياري<input type="number" inputmode="numeric" id="kcal" value="${log.kcal ?? ''}" placeholder="${fmtN(n.kcal)}"></label>
          </div>
        </section>
      </div>
    </div>`;
  },
  bind(root, arg) {
    const d = arg && /^\d{4}-\d\d-\d\d$/.test(arg) ? arg : today();
    let log = getLog(d);
    const ph = phaseFor(d), lim = ph?.painLimit ?? 0;
    let t;
    const commit = (rerender) => {
      saveLog(log);
      const s = $('#saved'); s.classList.add('show'); clearTimeout(t); t = setTimeout(() => s.classList.remove('show'), 1400);
      if (rerender) { const y = window.scrollY; route(); window.scrollTo(0, y); }
      else painAlert();
    };
    const painAlert = () => {
      const msgs = [];
      if (log.painDuring != null && log.painDuring > lim) msgs.push(`ألم التمارين (${log.painDuring}) فوق الحد المسموح (${lim}).`);
      if (log.painMorning != null && log.painMorning > lim) msgs.push(`ألم الصبح (${log.painMorning}) فوق الحد — الوتر ما تحمّل حمل أمس بالكامل.`);
      const exOver = Object.entries(log.ex || {}).filter(([, v]) => v.p != null && v.p > lim);
      if (exOver.length) msgs.push(`تمارين سببت ألم فوق الحد: ${exOver.map(([id]) => ph?.exercises.find(e => e.id === id)?.name).join('، ')}.`);
      $('#painAlert').innerHTML = msgs.length ? `<div class="alert bad">${ic('alert')}<div>${msgs.join('<br>')}<br><b>القاعدة:</b> لا تزيد الحمل (خطوات، تكرارات) لحد ما يرجع الألم ضمن الحد، وبلّغ د. أصيل.</div></div>` : '';
    };
    painAlert();
    $('#logDate').onchange = e => { if (e.target.value) location.hash = '#log/' + e.target.value; };
    $$('.ex-row', root).forEach(row => {
      const id = row.dataset.ex;
      $('.ex-check', row).onclick = () => {
        log.ex = log.ex || {}; const v = log.ex[id] || { d: null, p: null };
        v.d = v.d === null || v.d === undefined ? true : v.d === true ? false : null;
        log.ex[id] = v; commit(true);
      };
      $('select', row).onchange = e => { log.ex = log.ex || {}; const v = log.ex[id] || { d: null, p: null }; v.p = num(e.target.value); log.ex[id] = v; commit(); };
    });
    const ad = $('#allDone'); if (ad) ad.onclick = () => { log.ex = log.ex || {}; activeEx(ph).forEach(x => { log.ex[x.id] = { ...(log.ex[x.id] || { p: null }), d: true }; }); commit(true); };
    const ce = $('#clearEx'); if (ce) ce.onclick = () => { log.ex = {}; commit(true); };
    $$('[data-scale]', root).forEach(w => {
      const k = w.dataset.scale;
      $$('button', w).forEach(b => b.onclick = () => {
        const v = +b.dataset.v; log[k] = log[k] === v ? null : v;
        $$('button', w).forEach(x => { const on = +x.dataset.v === log[k]; x.setAttribute('aria-pressed', on); x.style.background = on ? painColor(+x.dataset.v, lim) : ''; });
        $('[data-v]', w).textContent = log[k] ?? '—';
        commit();
      });
    });
    for (const k of ['steps', 'weight', 'sleep', 'waist', 'protein', 'kcal']) $('#' + k).addEventListener('change', e => { log[k] = num(e.target.value); commit(k === 'protein' || k === 'kcal'); });
    $('#notes').addEventListener('input', e => { log.notes = e.target.value; clearTimeout(VIEWS.log._n); VIEWS.log._n = setTimeout(() => commit(), 500); });
    $('#flag').onchange = e => { log.flag = e.target.checked; commit(); };
    $('#vitD').onchange = e => { log.vitD = e.target.checked; commit(); };
    const stepper = (el, get, set) => {
      const inp = $('input', el);
      $$('button', el).forEach(b => b.onclick = () => { const v = Math.max(0, r1((num(inp.value) || 0) + +b.dataset.d)); inp.value = v; set(v); });
      inp.onchange = () => set(Math.max(0, num(inp.value) || 0));
    };
    stepper($('#water'), null, v => { log.water = v; commit(); });
    $$('.meal-slot[data-slot]', root).forEach(sl => {
      const sk = sl.dataset.slot;
      $$('.chip', sl).forEach(c => c.onclick = () => {
        log.meals = log.meals || [];
        const i = log.meals.findIndex(m => m.s === sk && m.m === c.dataset.meal);
        if (i >= 0) log.meals.splice(i, 1); else log.meals.push({ s: sk, m: c.dataset.meal, q: 1 });
        commit(true);
      });
      $$('[data-q]', sl).forEach(st => stepper(st, null, v => {
        const m = log.meals.find(m => m.s === sk && m.m === st.dataset.q); if (m) m.q = v;
        if (v === 0) log.meals = log.meals.filter(x => x !== m);
        commit(true);
      }));
    });
    $('#usual').onclick = () => {
      const has = id => D.meals.some(m => m.id === id);
      log.meals = [['b', 'm_pizza'], ['l', 'm_chard'], ['d', 'm_pizza'], ['x', 'm_tea']].filter(([, m]) => has(m)).map(([s, m]) => ({ s, m, q: 1 }));
      commit(true);
    };
    const unitLbl = () => { const f = foodById($('#xFood').value); $('#xUnit').textContent = f?.unit ? f.unit : 'غرام'; };
    $('#xFood').onchange = unitLbl; unitLbl();
    $('#xAdd').onclick = () => {
      const f = foodById($('#xFood').value), a = num($('#xAmt').value);
      if (!f || !a) { toast('اكتب الكمية'); return; }
      log.extra = log.extra || []; log.extra.push({ f: f.id, g: f.unitG ? a * f.unitG : a }); commit(true);
    };
    $$('[data-delx]', root).forEach(b => b.onclick = () => { log.extra.splice(+b.dataset.delx, 1); commit(true); });
  }
};

      values: c || {},
      onSave: v => { if (!v.date) return false; if (c) Object.assign(c, v); else D.consults.push({ id: uid('c'), ...v }); if (D.profile.nextConsult && D.profile.nextConsult <= v.date) D.profile.nextConsult = ''; saveCfg(); route(); },

    $$('[data-ep]', root).forEach(b => b.onclick = () => {

};

    const eta = target => addDays(t, Math.ceil((w - target) / rate * 7));
    return `
    <div class="page-head"><div><h1>خطة التعافي</h1><p>المسار الكامل من التأهيل للرجوع للكرة، والروتين اليومي، وخطة الوزن.</p></div></div>
    <div class="grid g2" style="align-items:start">
      <section class="card"><h2>مسار التأهيل</h2>
        <div class="roadmap">
          ${phs.map(x => { const done = x.end && x.end < t, now = x === ph; return `<div class="rm-step ${done ? 'done' : ''} ${now ? 'now' : ''}"><span class="node"></span><h3>${esc(x.name)}</h3><p>${fmtD(x.start)} ← ${x.end ? fmtD(x.end) : 'مستمرة'} · حد الألم ${x.painLimit} · ${fmtN(x.stepTarget)} خطوة</p><p>${esc(x.goal || '')}</p></div>`; }).join('')}

        <div class="alert info" style="margin-top:4px">${ic('info')}<div>المراحل اللاحقة مأخوذة من البروتوكولات المنشورة لعلاج التهاب الوتر الرضفي (تحميل تدريجي على 4 مراحل)، وموجودة هنا للفهم فقط. التوقيت والتمارين يقررها د. أصيل.</div></div>
      </section>
      <div class="stack">
        <section class="card"><h2>الروتين اليومي المقترح</h2>
          <div class="day-plan">
            <div class="t">الصبح</div><div>سجّل ألم أول خطوات بعد النوم (0–10)، وبعدها الوزن بعد الحمام وقبل الأكل.</div>
            <div class="t">الريوك</div><div>بيتزا الخضار والبيض. أضف لها مصدر بروتين (لبن مصفى أو جبن).</div>
            <div class="t">الدوام</div><div>قوم كل 30–45 دقيقة. لا تكعد طويلاً والركبة مثنية 90°، ومد رجلك تحت الميز.</div>
            <div class="t">المشي</div><div>قسّم الخطوات على 2–3 فترات بدل ما تمشيها مرة وحدة. على أرض مستوية، وبحذاء مريح.</div>
            <div class="t">الغداء</div><div>السلك أو الخباز، ويا مصدر بروتين (دجاج، سمك، عدس، تونة).</div>
            <div class="t">التمارين</div><div>جلسة تمارين د. أصيل كاملة، وسجّل ألم كل تمرين. الوقت المثالي بعد الغداء بساعتين أو بعد العصر.</div>
            <div class="t">العصر</div><div>الوجبة الثالثة، وبعدها شاي بالحليب.</div>
            <div class="t">الليل</div><div>نوم 7–9 ساعات. النوم هو وقت ترميم الكولاجين وإفراز هرمون النمو.</div>
            <div class="t">الجمعة</div><div>فيتامين D (50,000 IU)، وقياس محيط الخصر، ومراجعة الأسبوع.</div>
          </div>
        </section>
        <section class="card"><h2>خطة الوزن</h2>
          <p class="sub" style="margin-top:0">من <b class="num">${fmtN(w, 1)}</b> إلى <b class="num">${p.goalWeight}</b> كغم بمعدل <b class="num">${rate}</b> كغم بالأسبوع (يتغير من الإعدادات).</p>
          <table class="tbl"><thead><tr><th>المحطة</th><th>المتبقي</th><th>التاريخ المتوقع</th></tr></thead><tbody>
          ${ms.map(m => `<tr><td class="num"><b>${m}</b> كغم</td><td class="num">${fmtN(w - m, 1)} كغم</td><td>${fmtD(eta(m), { day: 'numeric', month: 'long', year: 'numeric' })}</td></tr>`).join('')}
          </tbody></table>
          <div class="alert warn" style="margin-top:12px">${ic('info')}<div>وزنك وقت ما كنت تلعب وتتمرن كان ${p.fitWeight} كغم وبيه كتلة عضلية. هدف ${p.goalWeight} أقل منه، فلما توصل حدود 70 راجع محيط الخصر وشكل الجسم قبل لا تكمل. النزول الصحيح يحافظ على العضل، وهذا أهم من الرقم.</div></div>
        </section>
        <section class="card"><h2>قواعد زيادة الحمل</h2>
          <ul style="margin:0;padding-inline-start:20px">
            <li>تزيد الخطوات أو التكرارات بس إذا كان ألم الصبح ضمن الحد يومين متتاليين.</li>
            <li>الزيادة تكون حوالي 10% بالأسبوع كحد أعلى (مثلاً 7000 ← 7700).</li>
            <li>إذا ارتفع ألم الصبح عن الحد: ارجع لحمل اليوم اللي قبله، وبلّغ الدكتور.</li>
            <li>يوم المشي الكثير (8000+) لا تضيف عليه درج عالي أو وقوف طويل.</li>
          </ul>
        </section>
      </div>
    </div>`;
  }
};

          <tr><td><b>الدهون</b></td><td class="num">~${e.fat} غ</td><td class="muted">28% من السعرات. ضرورية للهرمونات.</td></tr>
          <tr><td><b>الكاربوهيدرات</b></td><td class="num">~${Math.max(0, e.carbs)} غ</td><td class="muted">الباقي. وقود المشي والتمارين.</td></tr>

      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الوجبة</th><th>المكونات</th><th class="c">سعرات</th><th class="c">بروتين</th><th class="c">كارب</th><th class="c">دهون</th><th></th></tr></thead><tbody>
      ${D.meals.map(m => { const t = mealTotals(m); return `<tr><td><b>${esc(m.name)}</b><div class="muted">${MEAL_SLOTS[m.slot] || ''}</div></td><td class="muted">${m.items.map(it => { const f = foodById(it.f); return f ? `${esc(f.name.split('(')[0].trim())} ${f.unitG ? r1(it.g / f.unitG) + ' ' + f.unit : it.g + 'غ'}` : ''; }).join('، ')}</td>

        <ul style="margin:0;padding-inline-start:20px">

        <li>إذا صعب توصل للرقم: سكوب واي بروتين واحد (+24 غ).</li></ul></div>

    <section class="card" style="margin-top:16px"><h2>قاعدة الأغذية (لكل 100 غرام) <button class="btn sm" id="addFood">${ic('plus')} غذاء جديد</button></h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الغذاء</th><th class="c">سعرات</th><th class="c">بروتين</th><th class="c">كارب</th><th class="c">دهون</th><th></th></tr></thead><tbody>
      ${D.foods.map(f => `<tr><td>${esc(f.name)}</td><td class="c num">${f.kcal}</td><td class="c num">${f.p}</td><td class="c num">${f.c}</td><td class="c num">${f.f}</td><td><button class="btn sm iconbtn" data-ef="${f.id}" aria-label="تعديل">${ic('edit')}</button></td></tr>`).join('')}
      </tbody></table></div></section>`;
  },
  bind(root) {
    const mealEditor = m => {
      const items = clone(m?.items || []);
      const body = () => `<label class="f">اسم الوجبة<input id="mName" value="${esc(m?.name || '')}"></label>
        <label class="f" style="margin-top:10px">الوقت<select id="mSlot">${Object.entries(MEAL_SLOTS).map(([k, l]) => `<option value="${k}" ${m?.slot === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <h3 style="margin:16px 0 6px;font-size:15px">المكونات (بالغرام)</h3><div id="mItems"></div>
        <div class="meal-line"><select id="mF" style="flex:2">${D.foods.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><input id="mG" type="number" inputmode="decimal" placeholder="غرام" style="flex:1"><button type="button" class="btn sm" id="mAdd">${ic('plus')}</button></div>
        <p class="muted" id="mTot"></p>`;
      const dl = dialog({
        title: m ? 'تعديل الوجبة' : 'وجبة جديدة', body: body(), actions: [
          ...(m ? [{ label: 'حذف', cls: 'danger', run: () => { if (!confirm('حذف القالب؟')) return false; D.meals = D.meals.filter(x => x !== m); saveCfg(); route(); } }] : []),
          { label: 'إلغاء' },
          { label: 'حفظ', cls: 'primary', run: dl => { const name = $('#mName', dl).value.trim(); if (!name) return false; const v = { name, slot: $('#mSlot', dl).value, items }; if (m) Object.assign(m, v); else D.meals.push({ id: uid('m'), ...v }); saveCfg(); route(); } }
        ]
      });
      const draw = () => {
        $('#mItems', dl).innerHTML = items.map((it, i) => { const f = foodById(it.f); return `<div class="meal-line"><span style="flex:2">${esc(f?.name || it.f)}</span><input type="number" data-i="${i}" value="${it.g}" style="flex:1;min-height:38px"><button type="button" class="btn sm iconbtn danger" data-rm="${i}">${ic('trash')}</button></div>`; }).join('');
        const t = itemsTotals(items); $('#mTot', dl).textContent = `المجموع: ${fmtN(t.kcal)} سعرة · ${fmtN(t.p)} غ بروتين · ${fmtN(t.c)} غ كارب · ${fmtN(t.f)} غ دهون`;
        $$('[data-i]', dl).forEach(inp => inp.onchange = () => { items[+inp.dataset.i].g = num(inp.value) || 0; draw(); });
        $$('[data-rm]', dl).forEach(b => b.onclick = () => { items.splice(+b.dataset.rm, 1); draw(); });
      };
      $('#mAdd', dl).onclick = () => { const g = num($('#mG', dl).value); if (!g) return; items.push({ f: $('#mF', dl).value, g }); $('#mG', dl).value = ''; draw(); };
      draw();
    };
    $('#addMeal').onclick = () => mealEditor(null);
    $$('[data-em]', root).forEach(b => b.onclick = () => mealEditor(mealById(b.dataset.em)));
    const foodFields = [{ k: 'name', label: 'الاسم' }, { k: 'kcal', label: 'سعرات / 100غ', type: 'number' }, { k: 'p', label: 'بروتين / 100غ', type: 'number', step: '0.1' }, { k: 'c', label: 'كاربوهيدرات / 100غ', type: 'number', step: '0.1' }, { k: 'f', label: 'دهون / 100غ', type: 'number', step: '0.1' }, { k: 'unit', label: 'اسم الوحدة (اختياري، مثل: حبة)' }, { k: 'unitG', label: 'وزن الوحدة بالغرام (اختياري)', type: 'number', step: '0.1' }];
    $('#addFood').onclick = () => formDialog({ title: 'غذاء جديد', fields: foodFields, onSave: v => { if (!v.name) return false; D.foods.push({ id: uid('f'), ...v, kcal: v.kcal || 0, p: v.p || 0, c: v.c || 0, f: v.f || 0 }); saveCfg(); route(); } });
    $$('[data-ef]', root).forEach(b => b.onclick = () => { const f = foodById(b.dataset.ef); formDialog({ title: 'تعديل غذاء', fields: foodFields, values: f, onSave: v => { Object.assign(f, v); saveCfg(); route(); } }); });
  }
};

VIEWS.progress = {
  range: 30,
  html() {

    const start = R === 0 ? (all[0] || t) : addDays(t, -(R - 1));
    const days = dateRange(start, t);
    const st = days.map(dayStats);
    const ph = currentPhase();
    const ws = weightSeries().filter(p => p.x >= start);
    const wData = ws.length ? ws : [{ x: t, y: currentWeight() }];
    const segBtn = (v, l) => `<button data-rng="${v}" aria-pressed="${R === v}">${l}</button>`;
    const rows = [...st].reverse().filter(s => s.log);
    return `
    <div class="page-head"><div><h1>التقدم</h1><p>كل الرسوم من سجلك اليومي. مرّر إصبعك على الرسم حتى تشوف قيم كل يوم.</p></div>
      <div class="seg">${segBtn(14, '14 يوم')}${segBtn(30, '30 يوم')}${segBtn(90, '90 يوم')}${segBtn(0, 'الكل')}</div></div>

      <section class="card"><div class="chart-title"><h2 style="margin:0">ألم الوتر (0–10)</h2>
        <span class="legend" style="margin:0"><span><i style="background:var(--series-1)"></i>أثناء التمارين</span><span><i style="background:var(--series-2)"></i>الصبح</span></span></div>
        ${chart({ type: 'line', data: st.map(s => ({ x: s.date, y: s.painMax, m: s.painMorning })), series: [{ key: 'y', color: 'var(--series-1)' }, { key: 'm', color: 'var(--series-2)' }], yMin: 0, yMax: 10, ticks: [0, 2, 4, 6, 8, 10], refs: [{ y: ph?.painLimit ?? 0, label: 'الحد الحالي', color: 'var(--ok)' }], label: 'الألم', tip: d => `${fmtD(d.x)}<br>تمارين: <b>${d.y ?? '—'}</b> · صبح: <b>${d.m ?? '—'}</b>` })}</section>
      <section class="card"><div class="chart-title"><h2 style="margin:0">الالتزام بالتمارين (%)</h2><span class="muted">نسبة التمارين المنجزة من المطلوب</span></div>
        ${chart({ type: 'bar', data: st.map(s => ({ x: s.date, y: s.session === 'nodata' ? null : r0((s.pct || 0) * 100), c: s.pct >= .999 ? 'var(--series-3)' : 'var(--series-1)' })), yMin: 0, yMax: 100, ticks: [0, 25, 50, 75, 100], label: 'الالتزام', tip: d => d.y == null ? `${fmtD(d.x)}: غير مسجل` : `${fmtD(d.x)}<br><b>${d.y}%</b>` })}</section>
      <section class="card"><div class="chart-title"><h2 style="margin:0">النوم (ساعات)</h2></div>
